<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Coffeeshop BBN Hub</title>
<meta name="theme-color" content="#0033A0">
<meta name="apple-mobile-web-app-title" content="BBN Hub">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: sticky blue header + sport switch; blue matchup hero (matchup | season pulse); buzz rail; panels in a 2-col grid that stacks on phones */
:root{
  --uk:#0033A0; --bg:#f3f6fb; --surface:#ffffff; --fg:#0b1b3f; --muted:#5a6889; --line:#dbe2ef;
  --chip:#e7edf9; --win:#1a7f4b; --loss:#b4332a;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --uk:#4d7cf0; --bg:#070e1f; --surface:#0f1a33; --fg:#e8eefc; --muted:#94a3c4; --line:#1f2d4f;
  --chip:#18264a; --win:#4fd08e; --loss:#ff7a6e; color-scheme:dark}}
:root[data-theme="dark"]{--uk:#4d7cf0; --bg:#070e1f; --surface:#0f1a33; --fg:#e8eefc; --muted:#94a3c4; --line:#1f2d4f;
  --chip:#18264a; --win:#4fd08e; --loss:#ff7a6e; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#0033A0}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:#0033A0;color:#fff;
  background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.04) 0 2px,transparent 2px 14px)}
.hd{display:flex;align-items:center;gap:14px;padding-block:12px;flex-wrap:wrap}
.mark{font:900 30px/1 var(--display);border:3px solid #fff;padding:2px 8px 0;border-radius:4px}
.brand h1{font:800 22px/1 var(--display);margin:0;letter-spacing:1px;text-transform:uppercase}
.brand p{margin:4px 0 0;font:700 13px/1 var(--display);letter-spacing:2.2px;text-transform:uppercase;display:flex;align-items:center;gap:7px;color:rgba(255,255,255,.88)}
.brand p i{font-style:normal;color:#fff;background:rgba(255,255,255,.18);border-radius:50%;width:16px;height:16px;display:inline-grid;place-items:center;font-size:11px;letter-spacing:0}
.switch{margin-left:auto;display:flex;background:rgba(0,0,0,.25);border-radius:999px;padding:3px}
.switch button{all:unset;cursor:pointer;font:700 13px var(--body);padding:7px 14px;border-radius:999px}
.switch button[aria-pressed="true"]{background:#fff;color:#0033A0}
.switch button:focus-visible,nav button:focus-visible{outline:2px solid #fff;outline-offset:2px}
nav{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{all:unset;cursor:pointer;white-space:nowrap;font:600 13px var(--body);padding:6px 12px;border-radius:6px;color:rgba(255,255,255,.78)}
nav button[aria-current="true"]{color:#fff;background:rgba(255,255,255,.16)}

/* hero */
.hero{background:linear-gradient(#0033A0,#001a5c);color:#fff;padding-block:22px 28px}
.hero-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:stretch}
.hero-grid>.card-h{display:flex;flex-direction:column;justify-content:center}
.desk-only{display:flex;flex-direction:column}
.desk-only>.card-h{flex:1}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.mini div{background:rgba(255,255,255,.08);border-radius:8px;padding:8px 10px;min-width:0}
.mini b{display:block;font:800 22px/1 var(--display);font-variant-numeric:tabular-nums}
.mini span{font-size:11px;opacity:.75}
.pulse h4{display:flex;justify-content:space-between;align-items:center;gap:8px;font:700 11px var(--body);letter-spacing:1px;text-transform:uppercase;margin:16px 0 0;opacity:.85}
.lg{font-weight:500;letter-spacing:.5px;text-transform:none;display:flex;align-items:center}
.lg i{display:inline-block;width:8px;height:8px;margin:0 4px 0 10px}
.qnote{font-size:11px;opacity:.6;margin-top:2px}
.hero-grid>*{min-width:0}
@media (max-width:780px){.hero-grid{grid-template-columns:1fr}}
.card-h{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:18px}
.eyebrow{font:600 11px var(--body);letter-spacing:1.4px;text-transform:uppercase;opacity:.75}
.mu{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin:14px 0 12px}
.team{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;min-width:0}
.badge{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;font:900 28px/1 var(--display);letter-spacing:.5px;box-shadow:0 0 0 3px rgba(255,255,255,.25)}
.badge.uk{background:#fff;color:#0033A0}
.tname{font:800 22px/1 var(--display);text-transform:uppercase;letter-spacing:.5px}
.trec{font-size:12px;opacity:.8}
.rank{display:inline-block;font:700 11px var(--body);background:rgba(255,255,255,.18);padding:1px 7px;border-radius:999px}
.mid{text-align:center}
.mid b{display:block;font:900 26px/1 var(--display);opacity:.55}
.mid span{display:block;font:700 13px var(--body);margin-top:6px;white-space:nowrap}
.meta{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 14px;font-size:13px;opacity:.9}
.clock{display:flex;gap:8px;justify-content:center;margin-top:14px}
.clock div{background:rgba(0,0,0,.25);border-radius:6px;padding:6px 10px;text-align:center;min-width:56px}
.clock b{display:block;font:800 26px/1 var(--display);font-variant-numeric:tabular-nums}
.clock span{font-size:10px;letter-spacing:1px;text-transform:uppercase;opacity:.7}
.live{margin:14px auto 0;text-align:center;background:rgba(0,0,0,.28);border-radius:8px;padding:10px 16px;max-width:340px}
.live span{display:flex;align-items:center;justify-content:center;gap:6px;font:700 10px var(--body);letter-spacing:1.4px;text-transform:uppercase;color:#ff6b6b}
.live span::before{content:"";width:7px;height:7px;border-radius:50%;background:#ff3b30;animation:pulse 1.4s infinite}
.live b{display:block;font:800 26px/1.1 var(--display);margin-top:4px;font-variant-numeric:tabular-nums}
@keyframes pulse{50%{opacity:.25}}
.hwp{margin-top:16px}
.hwp-top{display:flex;justify-content:space-between;font:800 18px/1 var(--display);margin-bottom:5px;font-variant-numeric:tabular-nums}
.hwp-bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:rgba(255,255,255,.15)}
.hwp-bar .a{background:#fff}
.hwp-cap{font-size:11px;opacity:.7;margin-top:5px;text-align:center}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.stat{background:rgba(255,255,255,.08);border-radius:10px;padding:12px}
.stat b{display:block;font:800 30px/1 var(--display);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;opacity:.8}
.pulse svg{width:100%;height:auto;display:block;margin-top:10px}
.pulse .stats{margin-top:14px}
.pulse .stat{padding:10px 12px}
.pulse .stat b{font-size:24px}
.mob-only{display:none}
@media (max-width:780px){.desk-only{display:none}.mob-only{display:block}}
.pulse h3{font:700 17px/1 var(--display);text-transform:uppercase;margin:6px 0 0;letter-spacing:.8px;opacity:.9}

/* buzz rail */
.buzz{padding-block:20px 4px}
.buzz h2{margin-bottom:10px}
.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:10px;scrollbar-width:thin}
.bz{flex:0 0 min(78%,280px);scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0;overflow:hidden;display:flex;flex-direction:column;gap:0;text-decoration:none;min-width:0}
.bz:hover{border-color:var(--uk)}
.bz:focus-visible{outline:2px solid var(--uk);outline-offset:2px}
.bz .band{height:46px;display:flex;align-items:flex-end;padding:8px 14px;background:#0033A0;color:#fff;background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.07) 0 2px,transparent 2px 12px)}
.bz .band span{font:800 13px var(--display);letter-spacing:1.5px;text-transform:uppercase}
.bz .bd{padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px;flex:1}
.bz q{font:700 19px/1.2 var(--display);quotes:none;flex:1;text-wrap:balance}
.bz .who{font-size:12px;color:var(--muted)}
.bz.post .h{display:flex;align-items:center;gap:8px}
.bz.post .av{width:30px;height:30px;border-radius:50%;background:var(--uk);color:#fff;display:grid;place-items:center;font:800 13px var(--display)}
.bz.post .h b{font-size:13px}
.bz.post q{font:500 15px/1.4 var(--body)}
.bz.x q{font-size:26px}

main{padding-block:18px 48px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid>*{min-width:0}
@media (max-width:780px){.grid{grid-template-columns:1fr}}
.full{grid-column:1/-1}
section.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
h2{font:800 22px/1 var(--display);text-transform:uppercase;letter-spacing:.6px;margin:0 0 12px;display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;text-wrap:balance}
h2 small{font:500 12px var(--body);text-transform:none;letter-spacing:0;color:var(--muted)}

/* news cards */
.ncards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.nc{display:flex;flex-direction:column;text-decoration:none;border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:0}
.nc:hover{border-color:var(--uk)}
.nc:focus-visible{outline:2px solid var(--uk);outline-offset:2px}
.nc .band{height:64px;display:flex;align-items:flex-end;padding:8px 12px;background:#0033A0;color:#fff;
  background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.07) 0 2px,transparent 2px 12px)}
.nc .band span{font:800 13px var(--display);letter-spacing:1.5px;text-transform:uppercase}
.nc div.b{padding:10px 12px 12px}
.nc b{display:block;font:800 19px/1.15 var(--display);text-wrap:balance}
.nc span.s{display:block;font-size:12px;color:var(--muted);margin-top:4px}

/* schedule */
.sched{width:100%;border-collapse:collapse;font-size:14px}
.sched td{padding:9px 6px;border-top:1px solid var(--line);vertical-align:middle}
.sched tr.past td{color:var(--muted)}
.sched tr.nextrow td{background:var(--chip)}
.d{font:500 12px var(--mono);white-space:nowrap;width:1%}
.opp{font-weight:600}
.opp em{font-style:normal;font-weight:500;color:var(--muted);font-size:12px;margin-right:4px}
.res{text-align:right;white-space:nowrap;font:500 13px var(--mono)}
.W{color:var(--win);font-weight:700}.L{color:var(--loss);font-weight:700}
.tv{display:inline-block;font:600 11px var(--body);background:var(--chip);padding:2px 7px;border-radius:4px}
.tbl{overflow-x:auto}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:stretch}
.duo>*{min-width:0}
section.panel.fp{padding:0;overflow:hidden}
.feat{display:flex;flex-direction:column;justify-content:center;gap:8px;text-decoration:none;height:100%;padding:20px 20px 20px 18px;background:var(--chip);border-left:5px solid var(--uk)}
.feat .lab{font:700 11px var(--body);letter-spacing:1.4px;text-transform:uppercase;color:var(--uk)}
.feat b{font:800 28px/1.08 var(--display);text-wrap:balance}
.feat .s{font-size:13px;color:var(--muted)}
.feat .rd{align-self:flex-start;margin-top:6px;font:700 13px var(--body);color:#fff;background:var(--uk);padding:8px 14px;border-radius:8px}
.feat:hover b{color:var(--uk)}
.feat:focus-visible{outline:2px solid var(--uk);outline-offset:-2px}
.inj{display:grid;gap:12px}
.inj h4{margin:0 0 4px;font:800 15px var(--display);text-transform:uppercase;letter-spacing:.5px}
.inj p{margin:0;font-size:14px;line-height:1.45}
.inj p b{font:700 11px var(--body);letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin-right:6px}
.inj p b.out{color:var(--loss)}
.sect{padding-top:10px}
.sect h2{font-size:30px;margin:0;padding-left:12px;border-left:5px solid var(--uk)}
.watchline{padding:12px 18px}
.wl{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px}
.watchline b{font:800 15px var(--display);text-transform:uppercase;letter-spacing:.6px}
.watchline span{flex:1;min-width:200px;font-size:14px;color:var(--muted)}
.wlink{all:unset;cursor:pointer;font:700 13px var(--body);color:var(--uk)}
.wlink:focus-visible{outline:2px solid var(--uk);outline-offset:2px}
.padd{display:grid;gap:6px;margin-bottom:14px}
.padd div{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-bottom:1px solid var(--line);padding-bottom:6px;font-size:14px}
.padd em{font-style:normal;font:600 10px var(--body);color:var(--muted);letter-spacing:.8px}
.padd span{font-size:12px;color:var(--muted);text-align:right}
.follow{align-items:center;margin-top:12px}
.follow .cat{margin-right:2px}
.duo>.col{display:flex;flex-direction:column;gap:18px}
@media (max-width:780px){.duo{grid-template-columns:1fr}}
.socs{display:flex;flex-wrap:wrap;gap:8px}
.soc{display:inline-flex;align-items:center;gap:8px;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 5px;font:600 13px var(--body)}
.soc:hover{border-color:var(--uk)}
.soc:focus-visible{outline:2px solid var(--uk);outline-offset:2px}
.soc .si{width:26px;height:26px;border-radius:50%;background:var(--uk);color:#fff;display:grid;place-items:center;font:800 12px var(--display);letter-spacing:.3px}
.stog{all:unset;cursor:pointer;box-sizing:border-box;display:block;width:100%;text-align:center;margin-top:10px;padding:9px;border-radius:8px;background:var(--chip);font:700 13px var(--body);color:var(--uk)}
.stog:focus-visible{outline:2px solid var(--uk);outline-offset:2px}

.leaders{display:grid;gap:10px}
.leader{display:grid;grid-template-columns:86px 1fr auto;gap:10px;align-items:baseline;border-top:1px solid var(--line);padding-top:10px}
.leader:first-child{border-top:0;padding-top:0}
.cat{font:600 11px var(--body);letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.num{font:800 15px var(--display);font-variant-numeric:tabular-nums;color:var(--uk);text-align:right}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.p{border:1px solid var(--line);border-radius:8px;padding:10px}
.p b{display:block;font-size:14px}
.p span{font-size:12px;color:var(--muted)}
.tag{display:inline-block;font:600 10px var(--body);letter-spacing:.8px;text-transform:uppercase;padding:2px 6px;border-radius:3px;background:var(--uk);color:#fff;margin-bottom:4px}
.links{display:grid;gap:8px}
.lk{display:flex;justify-content:space-between;align-items:center;gap:10px;text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.lk:hover{border-color:var(--uk)}
.lk:focus-visible{outline:2px solid var(--uk);outline-offset:2px}
.lk b{font-size:14px}
.lk span{font-size:12px;color:var(--muted);display:block}
.lk i{font-style:normal;color:var(--uk);font-weight:700}
.watch dl{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:0;font-size:14px}
.watch dt{font-weight:700}
.watch dd{margin:0;color:var(--muted)}
.note{font-size:12px;color:var(--muted);margin-top:10px}
.lines{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:14px}
.line{background:var(--chip);border-radius:8px;padding:10px 12px;min-width:0}
.line span{display:block;font:600 10px var(--body);letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.line b{font:800 20px/1.15 var(--display);font-variant-numeric:tabular-nums}
.wp{margin-bottom:14px}
.wp-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px}
.wp-top b{font:900 30px/1 var(--display);font-variant-numeric:tabular-nums}
.wp-top .uk b{color:var(--uk)}
.wp-top .op{text-align:right}
.wp-top .op b{color:var(--muted)}
.wp-top span{display:block;font:600 11px var(--body);letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.wp-bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--line)}
.wp-bar .a{background:var(--uk)}
.wp-bar .b{background:var(--muted);opacity:.45}
.wp-cap{font-size:12px;color:var(--muted);margin-top:6px}
footer{font-size:12px;color:var(--muted);padding-block:0 32px}

/* clubhouse */
.club{padding-block:0 32px}
.club .cgrid{display:grid;grid-template-columns:1.1fr 1fr;gap:18px}
.club .cgrid>*{min-width:0}
@media (max-width:780px){.club .cgrid{grid-template-columns:1fr}}
.cav{display:inline-grid;place-items:center;border-radius:50%;background:var(--uk);color:#fff;font:800 13px var(--display);object-fit:cover;flex:0 0 auto}
.who{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px}
.who div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted);min-width:56px;text-align:center}
.cbtn{all:unset;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;font:700 14px var(--body);padding:10px 16px;border-radius:8px;background:var(--uk);color:#fff}
.cbtn.alt{background:var(--chip);color:var(--fg)}
.cbtn:focus-visible,.pk:focus-visible{outline:2px solid var(--uk);outline-offset:2px}
.cbtn[disabled]{opacity:.5;cursor:default}
.cin{font:15px var(--body);padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);width:100%;min-width:0}
.cform{display:grid;gap:10px;max-width:420px}
.cform label{font:600 12px var(--body);color:var(--muted);display:grid;gap:4px}
.crow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cmsg{font-size:13px;color:var(--muted)}
.cerr{font-size:13px;color:var(--loss)}
.game{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.game h3{font:800 18px/1.1 var(--display);text-transform:uppercase;margin:0 0 2px;letter-spacing:.4px}
.game .gm{font-size:12px;color:var(--muted);margin-bottom:10px}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pk{all:unset;cursor:pointer;border:2px solid var(--line);border-radius:8px;padding:10px;text-align:center;font:800 16px var(--display);text-transform:uppercase;letter-spacing:.4px}
.pk[aria-pressed="true"]{border-color:var(--uk);background:var(--chip)}
.pk[disabled]{cursor:default}
.pk .ppl{display:flex;justify-content:center;gap:2px;flex-wrap:wrap;margin-top:6px;min-height:22px}
.pk .cnt{display:block;font:600 11px var(--body);color:var(--muted);text-transform:none;letter-spacing:0;margin-top:2px}
.sg{display:flex;gap:6px;align-items:center;margin-top:10px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.sg input{width:72px}
.sg .sgl{flex-basis:100%;font:700 12px var(--body);color:var(--fg);text-transform:uppercase;letter-spacing:.8px}
.mid span+span{margin-top:2px;font-weight:600;opacity:.8}
.board{display:grid;gap:6px}
.board div{display:grid;grid-template-columns:22px 28px 1fr auto;gap:8px;align-items:center;font-size:14px}
.board b{font:800 16px var(--display);font-variant-numeric:tabular-nums}
.board .rk{font:700 12px var(--mono);color:var(--muted)}
.chat{display:flex;flex-direction:column;height:420px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.chat .list{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.chat .m{display:grid;grid-template-columns:28px 1fr;gap:8px}
.chat .m b{font-size:13px}
.chat .m time{font-size:11px;color:var(--muted);margin-left:6px}
.chat .m p{margin:2px 0 0;font-size:14px;overflow-wrap:anywhere}
.chat form{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
.club [data-uid]{cursor:pointer}
.club [data-uid]:focus-visible{outline:2px solid var(--uk);outline-offset:2px}

/* "Best bet": built only from the page's own data, i.e. the posted spread/total and the expert picks' projected scores.

/* lay the middle panels out in two columns, each panel going to the shorter column,
   then stretch the last card of the shorter column so both columns end flush */
function balance(){document.querySelectorAll("#main .duo").forEach(balanceOne)}
function balanceOne(box){
  const items=[...box.querySelectorAll("section.panel")];
  items.forEach((it,i)=>{if(it.dataset.o==null)it.dataset.o=i});items.sort((a,b)=>a.dataset.o-b.dataset.o);
  box.querySelectorAll(".col").forEach(c=>c.remove());
  items.forEach(it=>{it.style.flex="";box.appendChild(it)});
  const vis=items.filter(it=>it.style.display!=="none");
  box.style.display=vis.length?"grid":"none";box.style.gridTemplateColumns=vis.length===1?"1fr":"";
  if(vis.length<2||window.innerWidth<=780)return;
  const cols=[document.createElement("div"),document.createElement("div")];cols.forEach(c=>{c.className="col";box.appendChild(c)});
  items.forEach(it=>cols[0].appendChild(it));
  const hs=new Map(vis.map(it=>[it,it.offsetHeight]));
  /* try every split (first panel always on the left) and keep the most even one */
  let best=null;
  /* a "fixed" pair keeps its first panel on the left and everything else on the right */
  if(box.classList.contains("fixed")){const nl=+(box.dataset.left||1),m=((1<<vis.length)-1)&~((1<<nl)-1),t=[0,0];vis.forEach((it,i)=>t[(m>>i)&1]+=hs.get(it)+18);best={m,d:0,t}}
  else for(let m=0;m<1<<vis.length;m+=2){const t=[0,0];vis.forEach((it,i)=>t[(m>>i)&1]+=hs.get(it)+18);
    if(!t[1])continue;const d=Math.abs(t[0]-t[1]);if(!best||d<best.d)best={m,d,t}}
  if(!best)best={m:0,t:[1,0]};
  const last=[null,null];vis.forEach((it,i)=>{const c=(best.m>>i)&1;cols[c].appendChild(it);last[c]=it});
  const s=best.t[0]<best.t[1]?0:1;
  /* in Game Day the top panel of the shorter column grows (Odds & Picks on the left, the preview on the right) */
  const grow=box.classList.contains("fixed")?cols[s].querySelector("section.panel:not([style*='display: none'])"):last[s];if(grow)grow.style.flex="1";
}
let _bt;window.addEventListener("resize",()=>{clearTimeout(_bt);_bt=setTimeout(balance,120)});

function tick(){const el=document.getElementById("clock"); if(!el)return;
  const ms=new Date(D[sport].next.when)-Date.now();
  if(ms<=0){el.innerHTML=`<div><b>LIVE</b><span>or final</span></div>`;return}
  const d=Math.floor(ms/864e5),hh=Math.floor(ms/36e5)%24,m=Math.floor(ms/6e4)%60,s=Math.floor(ms/1e3)%60;
  el.innerHTML=[[d,"days"],[hh,"hrs"],[m,"min"],[s,"sec"]].map(([v,l])=>`<div><b>${String(v).padStart(2,"0")}</b><span>${l}</span></div>`).join("");}
setInterval(tick,1000);

document.querySelector(".switch").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  sport=b.dataset.sport;try{localStorage.setItem("bbn-sport",sport)}catch(_){} render();window.dispatchEvent(new Event("bbn-sport"));});
$("#hero").addEventListener("click",e=>{const b=e.target.closest("[data-switch]");if(!b)return;
  sport=b.dataset.switch;try{localStorage.setItem("bbn-sport",sport)}catch(_){} render();window.dispatchEvent(new Event("bbn-sport"));window.scrollTo({top:0})});
$("#tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;tab=b.dataset.tab;render();window.scrollTo({top:0})});
$("#main").addEventListener("click",e=>{if(e.target.closest("#stog")){schedOpen=!schedOpen;render()}
  const mo=e.target.closest("[data-more]");if(mo){const k=sport+mo.dataset.more;openL[k]=!openL[k];const l=mo.previousElementSibling;l.classList.toggle("open",openL[k]);mo.setAttribute("aria-expanded",openL[k]);mo.textContent=openL[k]?"Show fewer":`Show all ${l.children.length}`;if(!openL[k])l.closest("section").scrollIntoView({block:"nearest"})}
  const g=e.target.closest("[data-go]");if(g){tab=g.dataset.go;render();window.scrollTo({top:0})}});
render();
/* show the footer's update time in Eastern and Pacific */
(function(){const f=document.querySelector("footer");if(!f)return;const MS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const m=f.textContent.match(/([A-Z][a-z]{2}) (\d{1,2}), (\d{4}),? (\d{1,2}):(\d{2}) ?(AM|PM) ET/);if(!m)return;const mo=MS.indexOf(m[1]);if(mo<0)return;
  const d=new Date(Date.UTC(+m[3],mo,+m[2],(+m[4]%12)+(m[6]==="PM"?12:0)-3,+m[5])),h=d.getUTCHours();
  const pt=`${h%12||12}:${String(d.getUTCMinutes()).padStart(2,"0")} ${h>=12?"PM":"AM"} PT`+(d.getUTCDate()!==+m[2]?` (${MS[d.getUTCMonth()]} ${d.getUTCDate()})`:"");
  f.innerHTML=f.innerHTML.replace(m[0],m[0]+" / "+pt);})();

  document.getElementById("c-photo").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{photo=await shrink(f);document.getElementById("c-prev").innerHTML=av({photo},48)}catch(x){}};
  const out=document.getElementById("c-out");if(out)out.onclick=()=>C.auth.signOut();
  const cancel=document.getElementById("c-cancel");if(cancel)cancel.onclick=()=>{C.editing=false;drawMember()};
  document.getElementById("c-join").onsubmit=async ev=>{ev.preventDefault();
    const btn=document.getElementById("c-save");btn.disabled=true;
    const data={name:document.getElementById("c-name").value.trim().slice(0,40),photo:photo||null,
      code:C.member?C.member.code:document.getElementById("c-code").value.trim().toUpperCase().replace(/\s+/g,"")};
    if(!C.member)data.joinedAt=firebase.firestore.FieldValue.serverTimestamp();
    try{await C.db.collection("members").doc(C.user.uid).set(data,{merge:true});C.editing=false}
    catch(e){btn.disabled=false;drawJoin(e.code==="permission-denied"?(C.member?"Couldn't save. Try a smaller photo.":"That invite code didn't work."):e.message)}};
}
function shrink(file){return new Promise((res,rej)=>{const img=new Image(),url=URL.createObjectURL(file);
  img.onload=()=>{URL.revokeObjectURL(url);let out="";for(const [s,q] of [[480,.82],[400,.72],[320,.68],[240,.65]]){const c=document.createElement("canvas");c.width=s;c.height=s;const x=c.getContext("2d");
    const r=Math.max(s/img.width,s/img.height),w=img.width*r,h=img.height*r;x.drawImage(img,(s-w)/2,(s-h)/2,w,h);out=c.toDataURL("image/jpeg",q);if(out.length<140000)break}res(out)};
  img.onerror=rej;img.src=url;});}

/* ---------- member view ---------- */
function games(){
  return ["football","basketball"].map(sport=>{const t=D[sport];if(!t)return null;const i=t.schedule.findIndex(r=>!isRes(r));if(i<0)return null;
    const row=t.schedule[i],n=t.next||{},lock=n.when?new Date(n.when):null;
    return{sport,row,id:gid(sport,row),opp:n.opp||row[1],abbr:n.oppAbbr||row[5]||"OPP",lock,open:!!lock&&Date.now()<lock.getTime(),whenText:(n.whenText||row[0])+(n.timeText?" · "+etpt(n.timeText):"")}}).filter(Boolean);
}
/* pick'em shows the next game of whichever sport is selected at the top */
function nextGame(){return games().filter(g=>g.sport===sport)}
window.addEventListener("bbn-sport",()=>{if(C.member&&!C.editing)drawGames()});
function drawMember(){
  if(C.editing)return drawJoin();
  const me=C.member;
  root.innerHTML=panel(`<div class="crow" style="justify-content:space-between;margin-bottom:10px"><div class="crow">${av(me,32,C.user.uid)}<b>${esc(me.name)}</b></div>
     <div class="crow"><button class="cbtn alt" type="button" id="c-edit">Edit profile</button><button class="cbtn alt" type="button" id="c-out">Sign out</button></div></div>
    <div class="who" id="c-who"></div>
    <div class="cgrid"><div><h4>Pick'em</h4><div id="c-games"></div><h4 style="margin-top:16px">Leaderboard</h4><div class="board" id="c-board"></div></div>
    <div><h4>Group chat</h4><div class="chat"><div class="list" id="c-list"></div>
      <form id="c-chatf"><input class="cin" id="c-text" maxlength="500" placeholder="Say something, Coffeeshop" autocomplete="off"><button class="cbtn" type="submit">Send</button></form></div></div></div>`);
  document.getElementById("c-edit").onclick=()=>{C.editing=true;drawJoin()};
  document.getElementById("c-out").onclick=()=>C.auth.signOut();
  document.getElementById("c-chatf").onsubmit=async ev=>{ev.preventDefault();const inp=document.getElementById("c-text"),text=inp.value.trim();if(!text)return;inp.value="";
    try{await C.db.collection("chat").add({uid:C.user.uid,text:text.slice(0,500),at:firebase.firestore.FieldValue.serverTimestamp()})}catch(e){inp.value=text}};
  drawWho();drawGames();drawBoard();drawChat();
}
function drawWho(){const el=document.getElementById("c-who");if(!el)return;
  el.innerHTML=Object.entries(C.members).sort((a,b)=>(a[1].name||"").localeCompare(b[1].name||"")).map(([id,m])=>`<div>${av(m,40,id)}<span>${esc((m.name||"").split(" ")[0])}</span></div>`).join("");}
function drawGames(){const el=document.getElementById("c-games");if(!el)return;
  const gs=nextGame();if(!gs.length){el.innerHTML=`<p class="cmsg">No upcoming games on the schedule.</p>`;return}
  el.innerHTML=gs.map(g=>{const ps=C.picks.filter(p=>p.gameId===g.id),mine=ps.find(p=>p.uid===C.user.uid),d=C.drafts[g.id]||{};
    const sel=d.pick||(mine&&mine.pick)||"";
    const side=(k,label)=>{const who=ps.filter(p=>p.pick===k);return `<button class="pk" type="button" data-g="${g.id}" data-k="${k}" aria-pressed="${sel===k}" ${g.open?"":"disabled"}>${esc(label)}<span class="cnt">${who.length} pick${who.length===1?"":"s"}</span><span class="ppl">${who.map(p=>av(C.members[p.uid],22,p.uid)).join("")}</span></button>`};
    const status=!g.lock?"Picks open once the game time is announced.":g.open?`Picks lock at ${g.sport==="football"?"kickoff":"tip-off"}`:"Picks locked";
    const us=d.us??(mine&&mine.ukScore!=null?mine.ukScore:""),them=d.them??(mine&&mine.oppScore!=null?mine.oppScore:"");
    return `<div class="game"><h3>${g.sport==="football"?"Football":"Basketball"}: Kentucky vs ${esc(g.opp)}</h3><div class="gm">${esc(g.whenText)} · ${esc(status)}</div>
      <div class="sides">${side("UK","Kentucky")}${side("OPP",g.opp)}</div>
      ${g.open?`<div class="sg"><span class="sgl">Your score guess</span>Kentucky <input class="cin" type="number" min="0" max="200" id="us-${g.id}" value="${esc(us)}"> ${esc(g.abbr)} <input class="cin" type="number" min="0" max="200" id="them-${g.id}" value="${esc(them)}">
        <button class="cbtn" type="button" data-save="${g.id}" ${sel&&us!==""&&them!==""?"":"disabled"}>${mine?"Update pick":"Lock in pick"}</button></div>`:""}
      ${mine?`<div class="cmsg" style="margin-top:8px">Your pick: ${mine.pick==="UK"?"Kentucky":esc(g.opp)}${mine.ukScore!=null?` (${mine.ukScore}-${mine.oppScore})`:""}</div>`:""}
      <div class="cerr" id="err-${g.id}"></div></div>`}).join("");
  el.querySelectorAll(".pk").forEach(b=>b.onclick=()=>{const id=b.dataset.g;C.drafts[id]=Object.assign(C.drafts[id]||{},readScores(id),{pick:b.dataset.k});drawGames()});
  el.querySelectorAll("[data-save]").forEach(b=>b.onclick=()=>savePick(b.dataset.save));
  el.querySelectorAll("input[id^='us-'],input[id^='them-']").forEach(i=>i.oninput=()=>{const id=i.id.replace(/^(us|them)-/,""),sc=readScores(id),d=C.drafts[id]=Object.assign(C.drafts[id]||{},sc);
    if(sc.us!==""&&sc.them!==""&&+sc.us!==+sc.them){d.pick=+sc.us>+sc.them?"UK":"OPP";el.querySelectorAll(`.pk[data-g="${id}"]`).forEach(b=>b.setAttribute("aria-pressed",b.dataset.k===d.pick))}
    const mine=C.picks.find(p=>p.gameId===id&&p.uid===C.user.uid),pick=d.pick||(mine&&mine.pick),btn=el.querySelector(`[data-save="${id}"]`);
    if(btn)btn.disabled=!(pick&&sc.us!==""&&sc.them!=="")});
}
function readScores(id){const u=document.getElementById("us-"+id),t=document.getElementById("them-"+id);return{us:u?u.value:"",them:t?t.value:""}}
async function savePick(id){
  const g=games().find(x=>x.id===id);if(!g||!g.open)return;
  const mine=C.picks.find(p=>p.gameId===id&&p.uid===C.user.uid),d=Object.assign({},C.drafts[id]||{},readScores(id));
  const pick=d.pick||(mine&&mine.pick);if(!pick)return;
  const num=v=>v===""||v==null||isNaN(+v)?null:Math.max(0,Math.min(200,Math.round(+v)));
  const us=num(d.us),them=num(d.them);
  if(us==null||them==null){const el=document.getElementById("err-"+id);if(el)el.textContent="Enter a score for both teams.";return}
  try{await C.db.collection("picks").doc(id+"_"+C.user.uid).set({uid:C.user.uid,gameId:id,sport:g.sport,pick,ukScore:us!=null&&them!=null?us:null,oppScore:us!=null&&them!=null?them:null,
      lockAt:firebase.firestore.Timestamp.fromDate(g.lock),at:firebase.firestore.FieldValue.serverTimestamp()});delete C.drafts[id]}
  catch(e){const el=document.getElementById("err-"+id);if(el)el.textContent=e.code==="permission-denied"?"Picks are locked for this game.":e.message}
}
function tallies(){
  const finals={};["football","basketball"].forEach(sport=>(D[sport]?D[sport].schedule:[]).forEach(r=>{if(isRes(r)){const m=r[3].match(/^([WL]) (\d+)-(\d+)/);finals[gid(sport,r)]={w:m[1]==="W",a:+m[2],b:+m[3]}}}));
  const tally={};
  C.picks.forEach(p=>{const f=finals[p.gameId];if(!f||!C.members[p.uid])return;const t=tally[p.uid]=tally[p.uid]||{w:0,l:0,err:0};
    if((p.pick==="UK")===f.w)t.w++;else t.l++;
    if(p.ukScore!=null&&p.oppScore!=null)t.err+=Math.abs(p.ukScore-f.a)+Math.abs(p.oppScore-f.b);else t.err+=999;});
  return tally;
}
function drawBoard(){const el=document.getElementById("c-board");if(!el)return;
  const tally=tallies();
  const rows=Object.entries(tally).sort((a,b)=>b[1].w-a[1].w||a[1].err-b[1].err);
  el.innerHTML=rows.length?rows.map(([uid,t],i)=>`<div><span class="rk">${i+1}</span>${av(C.members[uid],28,uid)}<span>${esc(C.members[uid].name)}</span><b>${t.w}-${t.l}</b></div>`).join("")
    :`<p class="cmsg">Standings appear once a game you picked goes final. Ties are broken by closest score guesses.</p>`;
}
function drawChat(){const el=document.getElementById("c-list");if(!el)return;
  const atBottom=el.scrollHeight-el.scrollTop-el.clientHeight<40;
  el.innerHTML=C.chat.length?C.chat.map(m=>{const who=C.members[m.uid]||{name:"Former member"},d=m.at&&m.at.toDate?m.at.toDate():null;
    return `<div class="m">${av(who,28,m.uid)}<div><b>${esc(who.name)}</b><time>${d?d.toLocaleString([], {weekday:"short",hour:"numeric",minute:"2-digit"}):""}</time><p>${esc(m.text)}</p></div></div>`}).join("")
    :`<p class="cmsg">No messages yet. Start the trash talk.</p>`;
  if(atBottom||!el.dataset.init){el.scrollTop=el.scrollHeight;el.dataset.init="1"}
}

/* ---------- profile card ---------- */
const modal=document.createElement("div");modal.className="pmodal";modal.hidden=true;
modal.innerHTML=`<div class="pcard" role="dialog" aria-modal="true" aria-label="Profile"><button class="pclose" type="button" aria-label="Close">×</button><div id="pbody"></div></div>`;
document.body.appendChild(modal);
const closeProfile=()=>{modal.hidden=true};
modal.addEventListener("click",e=>{if(e.target===modal||e.target.closest(".pclose"))closeProfile()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!modal.hidden)closeProfile()});
function showProfile(uid){const m=C.members[uid];if(!m)return;
  const j=m.joinedAt&&m.joinedAt.toDate?m.joinedAt.toDate():null;
  const mine=C.picks.filter(p=>p.uid===uid);
  const cur=games().map(g=>{const p=mine.find(x=>x.gameId===g.id);return p?`<div>${g.sport==="football"?"Football":"Basketball"} vs ${esc(g.opp)}: <b>${p.pick==="UK"?"Kentucky":esc(g.opp)}</b>${p.ukScore!=null?` (${p.ukScore}-${p.oppScore})`:""}</div>`:""}).join("");
  document.getElementById("pbody").innerHTML=(okPhoto(m.photo)?`<img class="pbig" src="${m.photo}" alt="${esc(m.name)}">`:`<div class="pbig">${esc((m.name||"?").trim().charAt(0).toUpperCase())}</div>`)
    +`<h3>${esc(m.name)}</h3><div class="pmeta">${j?"Joined "+j.toLocaleDateString([], {month:"short",day:"numeric",year:"numeric"}):""}</div>
    ${cur?`<div class="pcur"><span>Current picks</span>${cur}</div>`:""}`;
  modal.hidden=false;modal.querySelector(".pclose").focus();}
root.addEventListener("click",e=>{const a=e.target.closest("[data-uid]");if(a){e.stopPropagation();e.preventDefault();showProfile(a.dataset.uid)}},true);
root.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches("[data-uid]")){e.preventDefault();showProfile(e.target.dataset.uid)}});

/* ---------- auth flow ---------- */
function onUser(u){
  stopAll();C.user=u;C.member=null;C.members={};C.picks=[];C.chat=[];C.editing=false;
  if(!u){const em=ls.get("bbn-email");if(C.auth.isSignInWithEmailLink(location.href)){em?finishEmail(em):drawConfirmEmail()}else drawSignIn();return}
  root.innerHTML=panel(`<p class="cmsg">Signing in…</p>`);
  let started=false;
  C.unsub.push(C.db.collection("members").doc(u.uid).onSnapshot(s=>{
    C.member=s.exists?s.data():null;
    if(!C.member){drawJoin();return}
    if(!started){started=true;
      C.unsub.push(C.db.collection("members").onSnapshot(q=>{C.members={};q.forEach(d=>C.members[d.id]=d.data());drawWho();drawGames();drawBoard();drawChat()}));
      C.unsub.push(C.db.collection("picks").onSnapshot(q=>{C.picks=[];q.forEach(d=>C.picks.push(d.data()));drawGames();drawBoard()}));
      C.unsub.push(C.db.collection("chat").orderBy("at","desc").limit(100).onSnapshot(q=>{C.chat=[];q.forEach(d=>C.chat.push(d.data()));C.chat.reverse();drawChat()}));
    }
    if(!C.editing)drawMember();
  },e=>{root.innerHTML=panel(`<p class="cerr">Couldn't load the Clubhouse: ${esc(e.message)}</p>`)}));
}

(async()=>{
  try{await loadScript(B+"firebase-app-compat.js");await loadScript(B+"firebase-auth-compat.js");await loadScript(B+"firebase-firestore-compat.js");}
  catch(e){root.innerHTML=panel(`<p class="cmsg">The Clubhouse works on the public website: <a href="https://coffeeshopbbn.github.io/coffeeshopbbn/" target="_blank" rel="noopener">coffeeshopbbn.github.io/coffeeshopbbn</a></p>`);return}
  firebase.initializeApp(FB_CFG);C.auth=firebase.auth();C.db=firebase.firestore();
  C.auth.onAuthStateChanged(onUser);
  setInterval(()=>{if(C.member&&!C.editing)drawGames()},60000);
})();
})();
</script>
